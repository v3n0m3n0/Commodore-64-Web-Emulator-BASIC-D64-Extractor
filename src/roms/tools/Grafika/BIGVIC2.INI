[MOUSE]
REM 0 divides mouse-x-position by 2
REM 1 mouse-x-position is not divided
mode=0;

[KOALA]
REM 0 save koala pictures in koala format
REM 1 save koala pictures in amica-paint format (packed)
koala=1;

[CLASH]
REM 0 set background, when color does not fit
REM 1 set nearest color, when color does not fit
clash=1;

[FLI]
REM 0 Game Graphics Designer Format
REM 1 Small Agnus Format
REM 2 Blackmail Format
savefli=0;
REM 0 Don't clear 3 chars on left side
REM 1 Clear 3 chars on left side
clearfli=0;

[MIXCOLOR]
REM 0 full mixed (16^2) precalculation
REM 1 selected mixed (42!) precalculation
mixmode=1;

[INTERLACE]
REM 0 interlaced viewmode, two pictures, but 70 Hz
REM 1 additive viewmode, one picture, no interlace (for eg. MILLENIUM-Cards)
lacemode=1;

REM Don't delete this line!